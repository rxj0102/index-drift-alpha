[project]
name = "index-drift-alpha"
version = "0.1.0"
description = "What happens to a stock that enters or leaves the S&P 400, and can it be traded? An event study"
requires-python = ">=3.11"
dependencies = [
    'numpy==2.1.3',
    'pandas==2.2.3',
    'matplotlib==3.9.4'
]

[dependency-groups]
dev = ['pytest>=7.4']
fetch = ['yfinance>=0.2.50']

[tool.uv]
package = false
