name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Rerun the study and confirm the committed results reproduce
        run: |
          cp results/metrics.json /tmp/committed.json
          python scripts/reproduce.py
          python scripts/compare_metrics.py /tmp/committed.json results/metrics.json
      - run: python scripts/render_readme.py --check
